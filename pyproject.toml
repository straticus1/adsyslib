[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adsyslib"
version = "0.1.0"
authors = [
  { name="Ryan", email="ryan@example.com" },
]
description = "A powerful system administration library for Python"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.31.0",
    "rich>=13.7.0",  # For pretty output/logging
    "typer>=0.9.0",  # For CLI
    "pyyaml>=6.0",   # For YAML audit package serialization
]

[project.optional-dependencies]
remote = [
    "paramiko>=3.0",
]
cloud = [
    "boto3>=1.34.0",
    "oci>=2.119.0",
]
container = [
    "docker>=7.0.0",
]
interact = [
    "pexpect>=4.9.0",
]
all = [
    "adsyslib[remote,cloud,container,interact]",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-PyYAML",
    "types-paramiko",
    "types-requests",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF013"]
ignore = ["E501"]  # long lines grandfathered; formatter handles new code

[tool.ruff.lint.per-file-ignores]
# typer.Option/Argument in defaults is the framework idiom
"src/adsyslib/cli/**" = ["B008"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true
# Lenient baseline; per-module strictness ratchets up during the unification phase
# (see docs/plans/2026-07-16-adsyslib-overhaul-design.md).

# Ratchet list emptied 2026-07-16 — every module type-checks. Do not re-add.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[project.scripts]
adsys = "adsyslib.cli.main:app"
