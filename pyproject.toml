[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adsyslib"
version = "0.1.0"
authors = [
  { name="Ryan", email="ryan@example.com" },
]
description = "A powerful system administration library for Python"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.31.0",
    "rich>=13.7.0",  # For pretty output/logging
    "typer>=0.9.0",  # For CLI
    "pyyaml>=6.0",   # For YAML audit package serialization
]

[project.optional-dependencies]
remote = [
    "paramiko>=3.0",
]
cloud = [
    "boto3>=1.34.0",
    "oci>=2.119.0",
]
container = [
    "docker>=7.0.0",
]
interact = [
    "pexpect>=4.9.0",
]
all = [
    "adsyslib[remote,cloud,container,interact]",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-PyYAML",
    "types-paramiko",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]  # ratchet: add B during per-module unification
ignore = ["E501"]  # long lines grandfathered; formatter handles new code

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
implicit_optional = true  # ratchet: codebase uses `param: str = None`; fix signatures then drop
warn_unused_ignores = true
# Lenient baseline; per-module strictness ratchets up during the unification phase
# (see docs/plans/2026-07-16-adsyslib-overhaul-design.md).

# RATCHET LIST: pre-existing type errors grandfathered at gate introduction (2026-07-16).
# Remove modules from this list as they are unified in Phase 2 — never add to it.
[[tool.mypy.overrides]]
module = [
    "adsyslib.authentik.client",
    "adsyslib.authentik.oauth",
    "adsyslib.cli.commands.authentik_cmd",
    "adsyslib.k8s.kubectl",
    "adsyslib.keycloak.client",
    "adsyslib.keycloak.migrate",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[project.scripts]
adsys = "adsyslib.cli.main:app"
